[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
[project]
name = "pagepatch-audit"
version = "0.1.0"
description = "Local-first static website checks and actionable fix plans"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
[project.scripts]
pagepatch = "pagepatch:main"
[tool.setuptools]
py-modules = ["pagepatch"]
